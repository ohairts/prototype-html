<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workbench</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/nav-arrows.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@900&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      background:#0b3b4a;
      font-family:"Roboto Slab", serif;
      overflow:hidden;
    }

    .stage{
      width:100vw;
      height:100vh;
      position:relative;
      background:#08394a;
      overflow:hidden;
      border: 3px solid rgba(0,0,0,.55);
      box-sizing: border-box;
    }

    .hero{
      position:absolute;
      left:50%;
      top:47%;
      transform: translate(-50%, -50%);
      width: min(640px, 70vw);
      height: min(460px, 60vh);
      background: url("images/workbenchpharmacy.png") center / cover no-repeat;
      border: 3px solid rgba(0,0,0,.65);
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
    }

    .panel{
      position:absolute;
      left:50%;
      bottom: 40px;
      transform: translateX(-50%);
      width: min(740px, 86vw);
      background: #d9d9d9;
      border: 3px solid rgba(0,0,0,.65);
      box-shadow: 0 14px 26px rgba(0,0,0,.35);
      padding: 16px 20px;
      text-align:center;
      z-index: 5;
    }

    .panel .title{
      font-weight: 900;
      font-size: clamp(18px, 2.2vw, 26px);
      margin: 0;
      color:#111;
      line-height:1.1;
    }

    .panel .subtitle{
      margin: 6px 0 0;
      font-weight: 900;
      font-size: clamp(14px, 1.6vw, 20px);
      color:#111;
      line-height:1.15;
    }

    /* Return button */
    .nav-btn{
      position:absolute;
      bottom: 62px;
      left: 42px;
      width: 86px;
      height: 74px;
      border: 3px solid rgba(0,0,0,.65);
      box-shadow: 0 14px 26px rgba(0,0,0,.35);
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      z-index: 10;
      transition: transform .12s ease, filter .12s ease;
      background: #ffcc00;
    }

    .nav-btn:hover{ transform: translateY(-2px); filter: brightness(1.05); }
    .nav-btn:active{ transform: translateY(1px) scale(.99); filter: brightness(.98); }

    .nav-btn .icon{
      font-size: 44px;
      color:#111;
      line-height:1;
      transform: translateY(-1px);
    }

    @media (max-width: 800px){
      .hero{ width: min(720px, 90vw); height: min(480px, 56vh); top:46%; }
      .panel{ bottom: 18px; width: min(760px, 92vw); }
      .nav-btn{ left: 18px; bottom: 18px; width: 76px; height: 64px; }
    }
  </style>
</head>

<body>
  <div class="stage">

    <div class="hero" aria-hidden="true"></div>

    <div class="panel">
      <p class="title">Workbench.</p>
      <p class="subtitle">(Workbench. Please explain to facilitator what you are doing.)</p>
    </div>

    <!-- Return button -->
    <div id="wbReturn" class="nav-btn" title="Return to Pharmacy Antibiotics" role="button" tabindex="0">
      <span class="icon">↩</span>
    </div>

  </div>

  <script type="module">
    // Optional timer persistence
    try{
      const mod = await import("./js/state.js");
      mod.ensureTimerStarted?.();
    }catch(e){}

    function goReturn(){
      window.location.href = "pharmacyantibiotics.html";
    }

    const returnBtn = document.getElementById("wbReturn");

    returnBtn.addEventListener("click", goReturn);
    returnBtn.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        goReturn();
      }
    });

    // Optional keyboard shortcut
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") goReturn();
    });
  </script>
</body>
</html>
