<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back to Patrick</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b3f53;
      --orange:#ea7a2c;
      --white:#fff;
      --black:#071018;
      --red:#e01212;
      --green:#57a82a;
      --shadow: rgba(0,0,0,0.35);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);font-family:"Roboto Slab",serif;overflow:hidden;}

    /* 16:9 stage */
    .stage{
      position:relative;
      width:min(100vw, calc(100vh * 16 / 9));
      height:min(100vh, calc(100vw * 9 / 16));
      margin:0 auto;
      background:var(--bg);
      overflow:hidden;
      border: 2px solid rgba(0,0,0,0.35);
    }

    .title{
      position:absolute;
      left: 12%;
      top: 10%;
      color: grey;
      font-weight: 800;
      font-size: clamp(42px, 5.5vw, 84px);
      text-shadow: 0 3px 0 rgba(0,0,0,0.25);
      letter-spacing: 0.5px;
      white-space: nowrap;
      z-index: 1;
    }

    /* Left vertical labels */
    .vertLabel{
      position:absolute;
      left: 5%;
      width: 4.5%;
      height: 34%;
      background: var(--orange);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 10px 18px var(--shadow);
      z-index: 4;
    }
    .vertLabel span{
      color: var(--white);
      font-weight: 800;
      letter-spacing: 1px;
      font-size: clamp(14px, 1.8vw, 22px);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      user-select:none;
    }
    #labIn{ top: 12%; }
    #labOut{ bottom: 12%; }

    /* Axis lines */
    .axisV{
      position:absolute;
      left: 10%;
      top: 10%;
      width: 4px;
      height: 80%;
      background: var(--black);
      z-index: 2;
      opacity: 0.9;
    }
    .axisH{
      position:absolute;
      left: 2%;
      top: 50%;
      width: 96%;
      height: 4px;
      background: var(--black);
      z-index: 2;
      opacity: 0.9;
    }

    /* Pictures */
    .imgBox{
      position:absolute;
      border-radius: 2px;
      overflow:hidden;
      box-shadow: 0 10px 18px var(--shadow);
      z-index: 1;
    }
    #imgLeft{ left: 12%; top: 26%; width: 24%; height: 40%; }
    #imgMid { left: 40%; top: 24%; width: 20%; height: 46%; }
    .imgBox img{ width:100%; height:100%; object-fit:cover; display:block; }

    /* Green next button (hidden until 9 attempts used) */
    .nextBtn{
      position:absolute;
      right: 4%;
      top: 18%;
      width: 6%;
      height: 44%;
      background: var(--green);
      border: 2px solid rgba(0,0,0,0.35);
      box-shadow: 0 10px 18px var(--shadow);
      z-index: 6;
      border-radius: 2px;
      display:none;
      cursor:pointer;
    }
    .nextBtn.show{
      display:block;
      animation: navPulse 650ms ease-in-out infinite;
    }
    @keyframes navPulse{
      0%,100%{ transform: scale(1); filter: brightness(1); }
      50%{ transform: scale(1.03); filter: brightness(1.15); }
    }
    .nextBtn:after{
      content:"";
      position:absolute;
      left: 50%;
      top: 50%;
      transform: translate(-40%,-50%);
      width:0;height:0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 30px solid rgba(0,0,0,0.35);
    }
    .nextBtn:before{
      content:"";
      position:absolute;
      left: 50%;
      top: 50%;
      transform: translate(-45%,-50%);
      width:0;height:0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 30px solid rgba(30,70,10,0.45);
      z-index: 1;
    }

    /* Wave layer */
    .waveLayer{
      position:absolute;
      inset: 0;
      width:100%;
      height:100%;
      z-index: 2;
      pointer-events:none;
      overflow: visible;
    }

    /* Moving dot */
    .dot{
      position:absolute;
      width: 34px;
      height: 34px;
      background: var(--red);
      border-radius: 50%;
      box-shadow: 0 10px 18px var(--shadow);
      z-index: 7;
      transform: translate(-50%,-50%);
    }

    /* Rectangles */
    .ring{
      position:absolute;
      width: 15%;
      height: 10%;
      border: 3px solid var(--red);
      z-index: 4;
      opacity: 0.95;
      cursor: default;
      pointer-events:auto;
      background: rgba(255,255,255,0.02);
      overflow: hidden; /* keep progress inside */
    }
    .ring:hover{ filter: brightness(1.08); }
    .ring.clicked{
      filter: brightness(1.12);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.12);
    }
    .ring.locked{
      pointer-events:none;
      opacity: 0.75;
    }
    .ring.armed{
      box-shadow: 0 0 0 6px rgba(255,255,255,0.18), 0 0 18px rgba(224,18,18,0.25);
      filter: brightness(1.15);
    }

    /* progress bar fills 1/3 per successful press (BOTTOM rectangles only have this element) */
    .ring .prog{
      position:absolute;
      left:0; bottom:0;
      height: 100%;
      width: 0%;
      background: rgba(87,168,42,0.85);
      transition: width 140ms linear;
    }

    /* X markers (optional visual feedback for top rectangles) */
    .xMark{
      position:absolute;
      width: 30px;
      height: 30px;
      z-index: 5;
      pointer-events:none;
      display:none;
    }
    .xMark.show{ display:block; }
    .xMark:before, .xMark:after{
      content:"";
      position:absolute;
      left: 50%;
      top: 50%;
      width: 32px;
      height: 6px;
      background: var(--red);
      transform-origin: center;
      border-radius: 2px;
      box-shadow: 0 6px 10px rgba(0,0,0,0.25);
    }
    .xMark:before{ transform: translate(-50%,-50%) rotate(45deg); }
    .xMark:after { transform: translate(-50%,-50%) rotate(-45deg); }

    /* +1 score popup images */
    .scorePopup{
      position:absolute;
      width: 56px;
      height: auto;
      z-index: 6;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.25));
      display:none;
      pointer-events:none;
    }
    .scorePopup.show{ display:block; }

    /* Positions */
    #ringP1{ left: 16%; top: 10%; }
    #ringP2{ left: 45%; top: 10%; }
    #ringP3{ left: 72%; top: 10%; }

    #x1{ left: 25.5%; top: 10.5%; }
    #x2{ left: 54.5%; top: 10.5%; }
    #x3{ left: 81.5%; top: 10.5%; }

    #ringT1{ left: 28%; top: 60%; }
    #ringT2{ left: 60%; top: 60%; }
    #ringT3{ left: 86%; top: 60%; }

    #a1{ left: 36%; top: 72%; }
    #a2{ left: 67%; top: 72%; }
    #a3{ left: 93%; top: 72%; }

    /* SVG wave styling */
    .wavePath{
      fill: none;
      stroke: rgba(0,0,0,0.35);
      stroke-width: 4;
    }

    /* =========================
       INTRO OVERLAY
       ========================= */
    .introOverlay{
      position:absolute;
      inset:0;
      background: rgba(180,180,180,0.28);
      z-index: 999;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .introBox{
      width: min(78%, 980px);
      background: rgba(235,235,235,0.95);
      border: 2px solid rgba(0,0,0,0.25);
      border-radius: 10px;
      box-shadow: 0 18px 34px rgba(0,0,0,0.45);
      padding: 26px 30px;
      text-align:center;
      color: #0b0f12;
    }
    .introBox .big{
      font-weight: 900;
      font-size: clamp(20px, 2.6vw, 34px);
      line-height: 1.2;
    }
    .introBox .small{
      margin-top: 10px;
      font-weight: 700;
      font-size: clamp(16px, 2.0vw, 26px);
      line-height: 1.25;
    }
    .fadeOut{ animation: fadeOut 450ms ease forwards; }
    @keyframes fadeOut{ to { opacity:0; } }
  </style>
</head>

<body>
  <div class="stage" role="application" aria-label="Back to Patrick slide">

    <!-- Intro overlay -->
    <div id="introOverlay" class="introOverlay" aria-label="Instructions">
      <div class="introBox">
        <div class="big">He’s lying affected side down.</div>
        <div class="small">
          Make sure you apply vibrations at full expiration of his breathing.
          <br/><br>
          (Please press the spacebar three times rapidly at full expiration to clear his chest effectively.)
        </div>
      </div>
    </div>

    <div class="title">Back to Patrick</div>

    <div id="labIn" class="vertLabel"><span>Inspiration</span></div>
    <div id="labOut" class="vertLabel"><span>Expiration</span></div>

    <div class="axisV"></div>
    <div class="axisH"></div>

    <div id="imgLeft" class="imgBox">
      <img src="images/oldmanworriedinbedoxygen.png" alt="Patrick with oxygen mask">
    </div>

    <div id="imgMid" class="imgBox">
      <img src="images/oldmanabdominalbreathing.png" alt="Chest image">
    </div>

    <!-- Top rectangles (SPACEBAR here wastes attempts + triggers cough/buzz audio) -->
    <div id="ringP1" class="ring" role="button" tabindex="0" data-kind="top" data-target="x1"></div>
    <div id="x1" class="xMark" aria-hidden="true"></div>

    <div id="ringP2" class="ring" role="button" tabindex="0" data-kind="top" data-target="x2"></div>
    <div id="x2" class="xMark" aria-hidden="true"></div>

    <div id="ringP3" class="ring" role="button" tabindex="0" data-kind="top" data-target="x3"></div>
    <div id="x3" class="xMark" aria-hidden="true"></div>

    <!-- Bottom rectangles (SPACEBAR x3 each while dot is inside; progress fills 1/3 per press) -->
    <div id="ringT1" class="ring" role="button" tabindex="0" data-kind="bottom" data-target="a1">
      <div class="prog" aria-hidden="true"></div>
    </div>
    <img id="a1" class="scorePopup" src="images/plusonescorepopup.png" alt="+1" aria-hidden="true" />

    <div id="ringT2" class="ring" role="button" tabindex="0" data-kind="bottom" data-target="a2">
      <div class="prog" aria-hidden="true"></div>
    </div>
    <img id="a2" class="scorePopup" src="images/plusonescorepopup.png" alt="+1" aria-hidden="true" />

    <div id="ringT3" class="ring" role="button" tabindex="0" data-kind="bottom" data-target="a3">
      <div class="prog" aria-hidden="true"></div>
    </div>
    <img id="a3" class="scorePopup" src="images/plusonescorepopup.png" alt="+1" aria-hidden="true" />

    <!-- Green nav arrow (appears after 9 attempts are used) -->
    <a id="nextBtn" class="nextBtn" href="ptpatientrecovery.html" aria-label="Next"></a>

    <!-- Wave + moving dot -->
    <svg id="waveSvg" class="waveLayer" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <path id="wavePath" class="wavePath" d=""></path>
    </svg>
    <div id="dot" class="dot" aria-label="Moving red dot"></div>

    <!-- Audio SFX -->
    <audio id="pingAudio" preload="auto">
      <source src="audio/audioping.mp3" type="audio/mpeg">
    </audio>
    <audio id="buzzAudio" preload="auto">
      <source src="audio/audiocoughchestclearance.m4a" type="audio/mp4">
    </audio>

    <!-- ✅ Background bed: tachypnoea (loop, 0.5 volume, 1.5x speed) -->
    <audio id="tachyBed" preload="auto" loop>
      <source src="audio/audiotachypnoea.m4a" type="audio/mp4">
    </audio>

  </div>

  <script>
    (function(){
      // =========================
      // INTRO OVERLAY (auto-hide)
      // =========================
      const overlay = document.getElementById("introOverlay");
      window.setTimeout(() => {
        if (!overlay) return;
        overlay.classList.add("fadeOut");
        window.setTimeout(() => { overlay.remove(); }, 500);
      }, 5000);

      // =========================
      // state.js scoring (INTACT)
      // +1 ONLY when a bottom rectangle becomes fully filled (max +3 on page)
      // =========================
      let addScore = function(){};
      try{
        import("./js/state.js")
          .then((mod)=>{
            if (mod && typeof mod.ensureTimerStarted === "function") mod.ensureTimerStarted();
            if (mod && typeof mod.addScore === "function") addScore = mod.addScore;
          })
          .catch((e)=>console.warn("state.js not loaded:", e));
      }catch(e){
        console.warn("Dynamic import not supported:", e);
      }

      // =========================
      // AUDIO: background tachypnoea bed
      // =========================
      const tachyBed = document.getElementById("tachyBed");

      function safePlay(a){
        try { return a.play(); } catch(e){ return Promise.reject(e); }
      }

      async function startTachyBed(){
        if (!tachyBed) return;
        tachyBed.volume = 0.5;
        tachyBed.playbackRate = 1.5;
        tachyBed.loop = true;
        try { tachyBed.currentTime = 0; } catch(e){}
        try{ await safePlay(tachyBed); }catch(e){}
      }

      startTachyBed();

      let bedArmed = false;
      function armBedOnce(){
        if (bedArmed) return;
        bedArmed = true;
        startTachyBed();
        window.removeEventListener("pointerdown", armBedOnce, true);
        window.removeEventListener("keydown", armBedOnce, true);
      }
      window.addEventListener("pointerdown", armBedOnce, true);
      window.addEventListener("keydown", armBedOnce, true);

      // =========================
      // WAVE + DOT CONFIG
      // =========================
      const PERIODS = 3;
      const LOOP_MS = 5200;
      const FPS_CAP = 60;

      const xStartPct = 10;
      const xEndPct   = 100;

      const midYPct   = 40;
      const ampPct    = 27;

      const stage = document.querySelector(".stage");
      const dot = document.getElementById("dot");
      const wavePathEl = document.getElementById("wavePath");

      function pctToPxX(p){ return (p/100) * stage.clientWidth; }
      function pctToPxY(p){ return (p/100) * stage.clientHeight; }

      function drawWavePath(){
        const VBW = 1600;
        const VBH = 900;

        const x0 = (xStartPct / 100) * VBW;
        const x1 = (xEndPct   / 100) * VBW;
        const yMid = (midYPct / 100) * VBH;
        const A = (ampPct     / 100) * VBH;

        const samples = 420;
        let d = `M ${x0.toFixed(2)} ${yMid.toFixed(2)} `;
        for (let i = 1; i <= samples; i++){
          const t = i / samples;
          const x = x0 + t * (x1 - x0);
          const y = yMid - A * Math.sin(2 * Math.PI * PERIODS * t);
          d += `L ${x.toFixed(2)} ${y.toFixed(2)} `;
        }
        wavePathEl.setAttribute("d", d.trim());
      }

      let t0 = performance.now();
      let last = 0;

      // =========================
      // SPACEBAR MECHANIC
      // - 9 total "attempts" (space presses while dot is inside ANY rectangle)
      // - Bottom rectangles: 3 presses to fill; progress fills 1/3 each time
      // - Top rectangles: wastes attempts + plays cough/buzz audio
      // - Ping plays ONLY when a bottom rectangle becomes fully filled
      // - +1 score ONLY when a bottom rectangle becomes fully filled (max +3)
      // - Nav arrow appears after 9 attempts used
      // =========================
      const ATTEMPTS_TOTAL = 9;
      const PRESS_PER_BOTTOM_RECT = 3;

      const nextBtn = document.getElementById("nextBtn");
      const pingAudio = document.getElementById("pingAudio");
      const buzzAudio = document.getElementById("buzzAudio");

      function playSfx(audioEl){
        if (!audioEl) return;
        try {
          audioEl.currentTime = 0;
          audioEl.play().catch(()=>{});
        } catch(e){}
      }

      const topRects = ["ringP1","ringP2","ringP3"]
        .map(id => document.getElementById(id))
        .filter(Boolean);

      const bottomRects = ["ringT1","ringT2","ringT3"]
        .map(id => document.getElementById(id))
        .filter(Boolean);

      const allRects = [...topRects, ...bottomRects];

      // Per-bottom-rect press counts (0..3)
      const bottomPress = new Map(bottomRects.map(r => [r, 0]));

      // To ensure +1 score only once per rectangle
      const bottomCompleted = new Set();

      let attemptsUsed = 0;

      function isDotInsideRect(rectEl){
        const d = dot.getBoundingClientRect();
        const r = rectEl.getBoundingClientRect();

        const dotCx = d.left + d.width / 2;
        const dotCy = d.top  + d.height / 2;

        return (
          dotCx >= r.left &&
          dotCx <= r.right &&
          dotCy >= r.top &&
          dotCy <= r.bottom
        );
      }

      function updateBottomProgress(rectEl){
        const n = bottomPress.get(rectEl) || 0;
        const pct = Math.min(100, (n / PRESS_PER_BOTTOM_RECT) * 100);

        const prog = rectEl.querySelector(".prog");
        if (prog) prog.style.width = pct + "%";

        if (n > 0) rectEl.classList.add("clicked");
        if (n >= PRESS_PER_BOTTOM_RECT) rectEl.classList.add("locked");
      }

      function getArmedRect(){
        // Return the first rectangle the dot is inside (prioritize bottom for fairness)
        for (const r of bottomRects){
          const n = bottomPress.get(r) || 0;
          if (n >= PRESS_PER_BOTTOM_RECT) continue; // already filled
          if (r.classList.contains("locked")) continue;
          if (isDotInsideRect(r)) return r;
        }
        for (const r of topRects){
          if (r.classList.contains("locked")) continue;
          if (isDotInsideRect(r)) return r;
        }
        return null;
      }

      function endAfterAttempts(){
        // Lock everything and show nav arrow
        allRects.forEach(r => {
          r.classList.remove("armed");
          r.classList.add("locked");
        });
        nextBtn.classList.add("show");
      }

      function handleSpacePress(){
        if (attemptsUsed >= ATTEMPTS_TOTAL) return;

        const armed = getArmedRect();
        if (!armed) return; // only count attempts if dot is inside a rectangle

        // Consume an attempt (this is the "9 opportunities")
        attemptsUsed++;

        const kind = armed.dataset.kind;

        if (kind === "top"){
          // Wasted attempt: play cough/buzz audio
          playSfx(buzzAudio);

          // Optional: show X mark on first time each top rect is used
          const targetId = armed.dataset.target;
          const targetEl = document.getElementById(targetId);
          if (targetEl) targetEl.classList.add("show");
        } else {
          // Bottom rectangle: advance progress
          const current = bottomPress.get(armed) || 0;
          if (current < PRESS_PER_BOTTOM_RECT){
            const next = current + 1;
            bottomPress.set(armed, next);
            updateBottomProgress(armed);

            // Completed this rectangle (3rd successful press)
            if (next === PRESS_PER_BOTTOM_RECT && !bottomCompleted.has(armed)){
              bottomCompleted.add(armed);

              // Ping only on completion
              playSfx(pingAudio);

              // Show +1 popup image
              const targetId = armed.dataset.target;
              const targetEl = document.getElementById(targetId);
              if (targetEl) targetEl.classList.add("show");

              // +1 score ONLY once per rectangle (max 3 total on page)
              addScore(1);
            }
          }
        }

        if (attemptsUsed >= ATTEMPTS_TOTAL){
          endAfterAttempts();
        }
      }

      // Spacebar listener (global)
      window.addEventListener("keydown", (e) => {
        if (e.code === "Space" || e.key === " "){
          e.preventDefault();
          handleSpacePress();
        }
      }, { passive: false });

      // =========================
      // WAVE/DOT ANIMATION + ARMING HIGHLIGHT
      // =========================
      function tick(now){
        if (now - last < (1000 / FPS_CAP)) { requestAnimationFrame(tick); return; }
        last = now;

        const H = stage.clientHeight;

        const x0 = pctToPxX(xStartPct);
        const x1 = pctToPxX(xEndPct);
        const yMid = pctToPxY(midYPct);
        const A = (ampPct/100) * H;

        const elapsed = (now - t0) % LOOP_MS;
        const u = elapsed / LOOP_MS;
        const x = x0 + u * (x1 - x0);
        const y = yMid - A * Math.sin(2*Math.PI*PERIODS*u);

        dot.style.left = x + "px";
        dot.style.top  = y + "px";

        if (attemptsUsed < ATTEMPTS_TOTAL){
          // highlight rects when dot is inside
          topRects.forEach(r => {
            const armed = !r.classList.contains("locked") && isDotInsideRect(r);
            r.classList.toggle("armed", armed);
          });

          bottomRects.forEach(r => {
            const n = bottomPress.get(r) || 0;
            const armed = !r.classList.contains("locked") && (n < PRESS_PER_BOTTOM_RECT) && isDotInsideRect(r);
            r.classList.toggle("armed", armed);
          });
        } else {
          allRects.forEach(r => r.classList.remove("armed"));
        }

        requestAnimationFrame(tick);
      }

      drawWavePath();
      requestAnimationFrame(tick);

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(drawWavePath, 80);
      });

      // If user leaves tab, pause bed (optional)
      document.addEventListener("visibilitychange", () => {
        if (document.hidden){
          try { tachyBed && tachyBed.pause(); } catch(e){}
        }
      });

      // initialize bottom progress visuals
      bottomRects.forEach(updateBottomProgress);
    })();
  </script>
</body>
</html>
